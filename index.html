<style>
/* Layout: eine zentrierte Spalte – Kopfzeile, Spielfenster mit Menü-Overlay, Tastenlegende. Bewusst nur dunkles Höhlen-Design. */
:root{
  --bg:#0e0b17; --panel:#1a1528; --line:#2c2442;
  --fg:#ece5f7; --muted:#9d92b5; --soft:#d3cae4; --ember:#ffb547; --moss:#7fc46a;
  --display:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body)}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;letter-spacing:.05em;color:var(--ember)}
.sub{color:var(--soft);font-size:15px;margin:0}
.screen{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);overflow:hidden;background:#05040a;container-type:size}
.screen > *{--u:min(1cqw,1.778cqh)}
#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
button{font-family:var(--body)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* Zahnrad */
.gear{position:absolute;top:calc(1.3*var(--u));right:calc(1.3*var(--u));width:clamp(30px,calc(5.4*var(--u)),48px);height:clamp(30px,calc(5.4*var(--u)),48px);border-radius:50%;padding:0;display:grid;place-items:center;
  background:rgba(14,11,23,.8);border:1px solid #3a3055;color:var(--fg);cursor:pointer;z-index:5;transition:transform .3s,color .2s}
.gear svg{width:58%;height:58%}
.gear:hover{color:var(--ember);transform:rotate(45deg)}

/* Menü-Overlay */
.menu{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;background:rgba(9,6,18,.84);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:clamp(11px,calc(1.9*var(--u)),17px)}
.tabs{display:flex;align-items:center;gap:.5em;padding:calc(1.5*var(--u)) calc(1.6*var(--u));padding-right:calc(calc(8*var(--u)) + 8px)}
.tab{font-weight:500;font-size:1em;padding:.4em 1.15em;border-radius:999px;background:transparent;border:1px solid #3a3055;color:var(--soft);cursor:pointer}
.tab:hover{border-color:var(--ember);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--ember);border-color:var(--ember);color:#22140a}
.resume{margin-left:auto;font-weight:500;font-size:.95em;padding:.4em 1em;border-radius:999px;background:var(--panel);border:1px solid #3a3055;color:var(--fg);cursor:pointer}
.resume:hover{border-color:var(--moss)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 calc(3*var(--u)) calc(2.5*var(--u))}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(30px,calc(9.5*var(--u)),90px);line-height:1;margin:calc(.6*var(--u)) 0 0;color:var(--ember);letter-spacing:.06em;text-shadow:0 0 .35em rgba(255,181,71,.4)}
.tagline{margin:.5em 0 0;color:var(--soft);font-size:1em}
/* Drei Spalten: Lumi | Play | leer – so steht Play genau in der Mitte */
.homeRow{flex:1;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:calc(5*var(--u))}
.homeRow .play{grid-column:2}
.skinCol{grid-column:1;justify-self:end;display:flex;flex-direction:column;align-items:center;gap:.4em}
#lumiPrev{width:clamp(58px,calc(13*var(--u)),124px);height:clamp(58px,calc(13*var(--u)),124px)}
.skinBtn{font-weight:500;font-size:1em;padding:.35em 1.1em;border-radius:999px;background:var(--panel);border:1px solid #3a3055;color:var(--fg);cursor:pointer}
.skinBtn:hover,.skinBtn[aria-expanded="true"]{border-color:var(--ember)}
.play{font-family:var(--display);font-weight:700;font-size:clamp(22px,calc(5.4*var(--u)),50px);padding:.3em 1.5em;border-radius:.35em;border:none;border-bottom:.14em solid #3f7a35;background:var(--moss);color:#102010;cursor:pointer;letter-spacing:.06em}
.play:hover{filter:brightness(1.08);transform:translateY(-1px)}
.play:active{transform:translateY(2px);border-bottom-width:.06em}
.swatches{display:flex;gap:.55em;align-items:center;padding:.5em .8em;background:var(--panel);border:1px solid #3a3055;border-radius:999px;margin-bottom:.4em}
.swatches span{color:var(--soft);font-size:.9em;margin-right:.2em}
.swatch{width:clamp(20px,calc(3.6*var(--u)),32px);height:clamp(20px,calc(3.6*var(--u)),32px);border-radius:50%;border:2px solid rgba(0,0,0,.3);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.mapHead{display:flex;align-items:baseline;gap:.8em;margin:calc(.4*var(--u)) 0 0}
.mapHead h2{font-family:var(--display);font-size:clamp(20px,calc(4.6*var(--u)),40px);margin:0;color:var(--ember)}
.mapHead p{margin:0;color:var(--soft)}
.map{position:relative;flex:1;width:100%;min-height:0}
.map > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map path{fill:none;stroke:#4a3f66;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;vector-effect:non-scaling-stroke}

  background:rgba(14,11,23,.92);border:1px solid #3a3055;color:var(--soft);font-size:14px;line-height:1.4;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
let VW = 640; const VH = 360, T = 32, GRAV = 0.55;
let G = 14, LH = 18;  // aktuelle Bodenreihe beim Bauen und Höhe der geladenen Ebene
const lc = document.createElement('canvas'), lx = lc.getContext('2d');
const FONT = '"Pixelify Sans", ui-monospace, monospace';
const BODY = '"Rubik", system-ui, "Segoe UI", sans-serif';
let S = 2;
const scr = $('screen');
function fit() {
  // Sichtbreite passt sich dem Bildschirm an, damit das Spiel den ganzen Querformat-Bildschirm füllt
  const sw = scr.clientWidth || 640, sh = scr.clientHeight || 360;
  VW = Math.round(Math.max(480, Math.min(820, VH * sw / sh)));
  const k = Math.min(sw / VW, sh / VH), cw = VW * k, ch = VH * k;
  Object.assign(cv.style, {width: cw + 'px', height: ch + 'px', left: (sw - cw) / 2 + 'px', top: (sh - ch) / 2 + 'px'});
  S = Math.max(1, Math.min(3, cw * (window.devicePixelRatio || 1) / VW));
  cv.width = lc.width = Math.round(VW * S); cv.height = lc.height = Math.round(VH * S);
  try { if (L) updateCam(true); } catch (_) {}
}
fit(); addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.ResizeObserver) new ResizeObserver(fit).observe(scr);

/* ---------- Farben ---------- */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const SKINS = [
  ['Rot', '#ff5d5d'], ['Orange', '#ff9a3c'], ['Gelb', '#ffcf6b'], ['Grün', '#6fdc7a'],
  ['Blau', '#55b8ff'], ['Indigo', '#7d7cff'], ['Violett', '#c77dff'],
].map(([name, c]) => ({name, c, dim: mix(c, '#000000', 0.3), hi: mix(c, '#ffffff', 0.65), feet: mix(c, '#000000', 0.45), rgb: hex2rgb(c)}));

const THEMES = {
  moss: {stone:'#2b2340', deep:'#191428', light:'#3d3359', speck:'#211a34', top:'#4f8a46', topHi:'#93d97e', blade:'#6fbf5c',
    hang:'#4f8a46', plank:'#6b4a32', plankHi:'#8c6443', mush:'#ff7ab8', bg:['#0a0814','#1b1231'], lay:['#151027','#1d1733'], spore:[150,230,140],
    decor:['tuft','mush','tuft','pebble','flower','tuft']},
  roots: {stone:'#35251f', deep:'#1f150f', light:'#4a3529', speck:'#271a13', top:'#7a5a2e', topHi:'#d3a15f', blade:'#a8823f',
    hang:'#6b4a2a', plank:'#5c3a22', plankHi:'#8a5c36', mush:'#ffb347', bg:['#120a08','#2a1a12'], lay:['#1c120d','#271911'], spore:[255,190,120],
    decor:['root','mush','pebble','root','tuft']},
  crystal: {stone:'#1d2140', deep:'#10132a', light:'#2e3664', speck:'#161a36', top:'#355a92', topHi:'#9be8ff', blade:'#6cc6ef',
    hang:'#6cc6ef', plank:'#3d4a7a', plankHi:'#8fb4ee', mush:'#7ef0ff', bg:['#060816','#141a3a'], lay:['#0e1230','#151b40'], spore:[140,210,255],
    decor:['crystal','pebble','crystal','tuft']},
  fungus: {stone:'#1e2b33', deep:'#101a20', light:'#2e424c', speck:'#17222a', top:'#2f7a6e', topHi:'#86f2d4', blade:'#4fb8a0',
    hang:'#4fb8a0', plank:'#4a3a5c', plankHi:'#8a70b4', mush:'#ff6fb1', bg:['#071014','#13262c'], lay:['#0c1a1f','#122328'], spore:[255,140,200],
    decor:['bigmush','mush','tuft','bigmush','mush']},
  ember: {stone:'#3a1f1c', deep:'#1f0e0c', light:'#53302a', speck:'#2a1512', top:'#8a3a1e', topHi:'#ffb06a', blade:'#d0662e',
    hang:'#a04a26', plank:'#4a2a1e', plankHi:'#9a5a32', mush:'#ffcf6b', bg:['#140605','#341410'], lay:['#1f0b09','#2a110d'], spore:[255,150,80],
    decor:['ember','pebble','ember','tuft']},
  abyss: {stone:'#1a1630', deep:'#0b091a', light:'#2b2549', speck:'#141126', top:'#4a3a8a', topHi:'#cdaeff', blade:'#8d6fe0',
    hang:'#8d6fe0', plank:'#2e2a50', plankHi:'#8a7fd0', mush:'#cdaeff', bg:['#04030a','#120f26'], lay:['#0a0818','#100d22'], spore:[200,170,255],
    decor:['crystal','pebble','tuft','crystal']},
};
for (const k in THEMES) { const t = THEMES[k]; t.id = k; t.shades = [t.stone, mix(t.stone, t.deep, .35), mix(t.stone, t.deep, .7), t.deep]; }

/* ---------- Ebenen-Bausteine ----------
   Jeder Abschnitt beginnt und endet auf Bodenhöhe G, damit sie sich frei kombinieren lassen. */
const SEG = {
  start(b, x) { b.ground(x, x+7); b.put(x+2, G-1, 'P'); b.put(x+6, G-1, 'o'); return x+8; },
  door(b, x) { b.ground(x, x+9); b.put(x+3, G-2, 'o'); b.put(x+6, G-1, 'D'); return x+10; },
  check(b, x) { b.ground(x, x+5); b.put(x+2, G-1, 'C'); return x+6; },
  flat(b, x, n = 8, lan = 2, enemy = false) {
    b.ground(x, x+n-1);
    for (let i = 1; i <= lan; i++) b.put(x + Math.round(i*n/(lan+1)), i % 2 ? G-1 : G-3, 'o');
    if (enemy) b.put(x+n-3, G-1, 'e');
    return x+n;
  },
  gap(b, x, n = 2) { b.put(x + Math.floor((n-1)/2), G-3, 'o'); return x+n; },
  stairs(b, x) {
    b.ground(x, x+2); b.ground(x+3, x+5, G-2); b.ground(x+6, x+10, G-4); b.put(x+8, G-6, 'o');
    b.ground(x+11, x+13, G-2); b.put(x+12, G-3, 'o'); b.ground(x+14, x+15); return x+16;
  },
  spikeRun(b, x) {
    b.ground(x, x+11); b.fill(x+3, x+8, G-1, G-1, '^'); b.fill(x+2, x+9, G-2, G-2, '=');
    b.put(x+4, G-3, 'o'); b.put(x+7, G-5, 'o'); return x+12;
  },
  pillars(b, x, tops = [1, 3, 2, 4, 2]) {
    let c = x; b.ground(c, c+1); c += 2;
    tops.forEach((t, i) => { c += 2; b.ground(c, c+1, G-t); if (i % 2) b.put(c, G-t-2, 'o'); c += 2; });
    c += 2; b.ground(c, c+2); return c+3;
  },
  tunnel(b, x, n = 14) {
    b.ground(x, x+n-1); b.fill(x+2, x+n-3, 0, G-4, '#');
    for (let c = x+4; c < x+n-4; c += 4) { b.put(c, G-3, 'w'); b.put(c+1, G-3, 'w'); }
    b.put(x+3, G-1, 'o'); b.put(x+n-4, G-1, 'o'); b.put(x+Math.floor(n/2)-1, G-1, 'e'); return x+n;
  },
  shaft(b, x) {
    b.ground(x, x+5); b.fill(x+3, x+3, 0, G-3, '#'); b.ground(x+6, x+12, G-7);
    b.put(x+4, G-4, 'o'); b.put(x+5, G-7, 'o'); b.put(x+9, G-9, 'o');
    b.ground(x+13, x+14, G-5); b.ground(x+15, x+16, G-3); b.ground(x+17, x+18); return x+19;
  },
  wallClimb(b, x) {
    b.ground(x, x+2); b.ground(x+3, x+8, G-5); b.put(x+2, G-4, 'o'); b.put(x+5, G-7, 'o'); b.put(x+7, G-7, 'o');
    b.ground(x+9, x+10, G-3); b.ground(x+11, x+13); return x+14;
  },
  crumbleBridge(b, x) {
    b.ground(x, x+1); for (const o of [2, 5, 8]) b.fill(x+o, x+o+1, G, G, 'X');
    b.put(x+4, G-2, 'o'); b.put(x+7, G-2, 'o'); b.put(x+10, G-2, 'o'); b.ground(x+11, x+13); return x+14;
  },
  crumbleClimb(b, x) {
    b.ground(x, x+2); b.ground(x+3, x+12); b.fill(x+3, x+12, G-1, G-1, '^');
    b.fill(x+4, x+5, G-2, G-2, 'X'); b.fill(x+7, x+8, G-4, G-4, 'X'); b.fill(x+10, x+11, G-6, G-6, 'X');
    b.put(x+6, G-4, 'o'); b.put(x+9, G-6, 'o');
    b.ground(x+13, x+16, G-6); b.put(x+15, G-8, 'o');
    b.ground(x+17, x+18, G-4); b.ground(x+19, x+20, G-2); b.ground(x+21, x+22); return x+23;
  },
  movingCross(b, x) {
    b.ground(x, x+1); b.put(x+3, G-1, 'm'); b.put(x+5, G-3, 'o'); b.put(x+9, G-2, 'M'); b.put(x+11, G-4, 'o');
    b.put(x+14, G-3, 'o'); b.ground(x+16, x+18); return x+19;
  },
  lift(b, x) {
    b.ground(x, x+3); b.put(x+5, G-1, 'v'); b.put(x+6, G-5, 'o'); b.ground(x+8, x+13, G-6);
    b.put(x+10, G-8, 'o'); b.put(x+12, G-8, 'o');
    b.ground(x+14, x+15, G-4); b.ground(x+16, x+17, G-2); b.ground(x+18, x+19); return x+20;
  },
  springUp(b, x) {
    b.ground(x, x+12); b.put(x+3, G-1, 'S'); b.fill(x+4, x+10, G-7, G-7, '=');
    b.put(x+5, G-8, 'o'); b.put(x+7, G-8, 'o'); b.put(x+9, G-8, 'o'); b.put(x+9, G-1, 'e'); return x+13;
  },
  enemyRun(b, x) {
    b.ground(x, x+13); b.ground(x+6, x+7, G-2); b.put(x+3, G-1, 'e'); b.put(x+11, G-1, 'e'); b.put(x+9, G-1, '^');
    b.put(x+6, G-4, 'o'); b.put(x+2, G-2, 'o'); b.put(x+12, G-3, 'o'); return x+14;
  },
  planksZig(b, x) {
    b.ground(x, x+13); b.fill(x+2, x+4, G-2, G-2, '='); b.fill(x+6, x+8, G-4, G-4, '=');
    b.fill(x+2, x+4, G-6, G-6, '='); b.fill(x+6, x+9, G-8, G-8, '=');
    b.put(x+3, G-3, 'o'); b.put(x+3, G-7, 'o'); b.put(x+7, G-9, 'o'); b.put(x+9, G-9, 'o'); return x+14;
  },
  arch(b, x) {
    b.ground(x, x+11); b.fill(x, x+11, 0, G-7, '#'); b.fill(x+1, x+2, G-6, G-6, '#'); b.fill(x+9, x+10, G-6, G-6, '#');
    b.ground(x+5, x+6, G-1); b.put(x+4, G-3, 'o'); b.put(x+7, G-3, 'o'); return x+12;
  },
  dashGap(b, x) { b.ground(x, x+1); b.put(x+3, G-3, 'o'); b.put(x+6, G-3, 'o'); b.ground(x+8, x+10); return x+11; },

  /* --- Richtungswechsel: nach unten und nach oben --- */
  descend(b, x, d = 8) {
    // Fallschacht: hohe Wand rechts zwingt nach unten, unten geht es durch eine Öffnung weiter
    const g0 = G; b.ground(x, x+3, g0);
    b.fill(x+8, x+9, g0-5, g0+d-3, '#');
    b.ground(x+4, x+15, g0+d);
    for (let k = 3, s = 0; k <= d-3; k += 3, s ^= 1) b.put(s ? x+7 : x+4, g0+k, '#');
    b.put(x+6, g0+2, 'o'); b.put(x+12, g0+d-2, 'o');
    G = g0 + d; return x+16;
  },

function makeLevel(i) {

    put(c, r, ch) { b.fill(c, c, r, r, ch); },
    ent(c, r, ch) { ents.push([c, r, ch]); },  // Objekt, das die Kachel darunter (z. B. Scheinfels) nicht ersetzt

  const w = x, g = Array.from({length: LH}, () => Array(w).fill(' '));
  for (const [k, ch] of cells) { const r = Math.floor(k / 100000), c = k % 100000; if (c < w) g[r][c] = ch; }

    checks: [], crumbles: [], cmap: new Map(), fgroups: [], fmap: new Map(), occupied: new Set(), door: null, start: null };
  const add = (ch, c, r) => {
    const px = c * T, py = r * T;
    L.occupied.add(r * w + c);
    if (ch === 'P') L.start = {x: px + 7, y: py + T - 24};
    else if (ch === 'o' || ch === 'O') L.lanterns.push({x: px + 16, y: py + 16, got: false, ph: (c * 7 + r * 3) % 6, secret: ch === 'O'});
    else if (ch === 'e') L.enemies.push({sx: px + 5, sy: py + T - 16, x: px + 5, y: py + T - 16, w: 22, h: 16, vx: 0, vy: 0, dir: -1, alive: true});
    else if ('mMv'.includes(ch)) L.plats.push({ox: px, oy: py, x: px, y: py, w: 64, h: 12, axis: ch === 'v' ? 'v' : 'm', range: 96, t: ch === 'M' ? 157 : 0, dx: 0, dy: 0});
    else if (ch === 'S') L.springs.push({x: px, y: py, sq: 0});
    else if (ch === '^') L.spikes.push({x: px, y: py, down: false});
    else if (ch === 'w') L.spikes.push({x: px, y: py, down: true});
    else if (ch === 'C') L.checks.push({x: px, y: py, on: false});

  for (let r = 0; r < LH; r++) for (let c = 0; c < w; c++) {
    const ch = g[r][c];

  }
  for (const [c, r, ch] of ents) if (c < w && r < LH) add(ch, c, r);
  // Bröckelplatten: zusammenhängende X in einer Reihe bilden eine Gruppe
  for (let r = 0; r < LH; r++) for (let c = 0; c < w; c++) {
    if (g[r][c] !== 'X' || L.cmap.has(r * w + c)) continue;
    let c2 = c; while (c2 + 1 < w && g[r][c2 + 1] === 'X') c2++;
    const grp = {x: c * T, y: r * T, w: (c2 - c + 1) * T, solid: true, timer: 0, gone: 0, touched: false, flash: 0};
    L.crumbles.push(grp);
    for (let k = c; k <= c2; k++) L.cmap.set(r * w + k, grp);
  }
  // Scheinfels: zusammenhängende F-Kacheln bilden einen Geheimraum
  for (let r = 0; r < LH; r++) for (let c = 0; c < w; c++) {
    if (g[r][c] !== 'F' || L.fmap.has(r * w + c)) continue;
    const grp = {alpha: 1, found: false, inside: false}, stack = [[c, r]];
    L.fgroups.push(grp); L.fmap.set(r * w + c, grp);
    while (stack.length) {
      const [cc, rr] = stack.pop();
      for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nc = cc + dc, nr = rr + dr;
        if (nr >= 0 && nr < LH && nc >= 0 && nc < w && g[nr][nc] === 'F' && !L.fmap.has(nr * w + nc)) { L.fmap.set(nr * w + nc, grp); stack.push([nc, nr]); }

  for (const s of L.lanterns) s.grp = L.fmap.get(Math.floor(s.y / T) * w + Math.floor(s.x / T)) || null;

  for (let k = 0; k < keep; k++) pick.push(norm[Math.floor((k + 0.5) * norm.length / keep)]);

}

function overlap(a, x, y, w, h) { return a.x < x + w && a.x + a.w > x && a.y < y + h && a.y + a.h > y; }

  const r1 = Math.floor((o.y + 3) / T), r2 = Math.floor((o.y + o.h - 3 - 0.01) / T);

}

  if (o.vx > 0) { const c = Math.floor((o.x + o.w - 0.01) / T); for (let r = r1; r <= r2; r++) if (solid(c, r)) { o.x = c*T - o.w; o.vx = 0; o.hitWall = true; break; } }

}

    if (hash(r, c) > 0.5) { ctx.fillStyle = th.hang; ctx.fillRect(x + 12, y + 8, 2, 7); ctx.fillRect(x + 10, y + 12, 2, 2); }
  }
}
function drawTiles() {
  const c1 = Math.max(0, Math.floor(cam.x / T) - 1), c2 = Math.min(L.w - 1, Math.floor((cam.x + VW) / T) + 1);
  const r1 = Math.max(0, Math.floor(cam.y / T) - 1), r2 = Math.min(LH - 1, Math.floor((cam.y + VH) / T) + 1);
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
    const ch = L.tiles[r][c];
    if (ch === '#') drawRock(c, r, c * T, r * T);
    else if (ch === '=') drawPlank(c, r, c * T, r * T);
  }
}
function drawCrumble(g) {
  if (g.x > cam.x + VW || g.x + g.w < cam.x) return;
  if (!g.solid) {
    // Geisterlinie, solange die Platte weg ist
    const soon = g.gone > 180 ? 0.35 + 0.3 * Math.sin(tick * 0.4) : 0.3;
    ctx.save(); ctx.setLineDash([5, 4]); ctx.lineDashOffset = -tick * 0.3;
    ctx.strokeStyle = `rgba(230,220,255,${soon})`; ctx.lineWidth = 1.5;
    ctx.strokeRect(g.x + 1.5, g.y + 1.5, g.w - 3, T - 3); ctx.restore();
    return;
  }
  const th = L.theme, k = g.timer / 40, sx = g.timer ? (Math.random() - .5) * 3 * k : 0, sy = g.timer ? (Math.random() - .5) * 2 * k : 0;
  const base = mix(th.light, '#d8c8a8', .25);
  for (let x = g.x; x < g.x + g.w; x += T) {
    const c = x / T, X = x + sx, Y = g.y + sy;
    ctx.fillStyle = base; ctx.fillRect(X + 1, Y + 1, T - 2, T - 2);
    ctx.fillStyle = mix(base, '#000000', .35); ctx.fillRect(X + 1, Y + T - 6, T - 2, 5);
    ctx.fillStyle = mix(base, '#ffffff', .25); ctx.fillRect(X + 1, Y + 1, T - 2, 3);
    ctx.strokeStyle = mix(base, '#000000', .5); ctx.lineWidth = 1.2; ctx.beginPath();
    const h = hash(c, g.y);
    ctx.moveTo(X + 6 + h * 8, Y + 4); ctx.lineTo(X + 12 + h * 6, Y + 14); ctx.lineTo(X + 8 + h * 10, Y + 24);
    ctx.moveTo(X + 12 + h * 6, Y + 14); ctx.lineTo(X + 24, Y + 18);
    ctx.stroke();
    ctx.fillStyle = mix(base, '#000000', .5); ctx.fillRect(X + 1, Y + 1, 1, T - 2); ctx.fillRect(X + T - 2, Y + 1, 1, T - 2);
  }
  if (g.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${g.flash / 30})`; ctx.fillRect(g.x, g.y, g.w, T); }
}
function drawSpike(s) {
  ctx.save();
  if (s.down) { ctx.translate(s.x + T / 2, s.y + T / 2); ctx.scale(1, -1); ctx.translate(-s.x - T / 2, -s.y - T / 2); }
  for (let i = 0; i < 3; i++) {
    const bx = s.x + 2 + i * 10, h = i === 1 ? 20 : 14;
    ctx.fillStyle = '#c4b3ff'; ctx.beginPath(); ctx.moveTo(bx, s.y + T); ctx.lineTo(bx + 5, s.y + T - h); ctx.lineTo(bx + 10, s.y + T); ctx.fill();
    ctx.fillStyle = '#7d68d6'; ctx.beginPath(); ctx.moveTo(bx + 5, s.y + T - h); ctx.lineTo(bx + 10, s.y + T); ctx.lineTo(bx + 5, s.y + T); ctx.fill();
  }
  ctx.restore();
}
function drawSpring(s) {
  const sq = s.sq > 6 ? (12 - s.sq) / 6 : s.sq / 6, capY = s.y + 14 + sq * 5;
  ctx.fillStyle = '#d8cbb2'; ctx.fillRect(s.x + 12, capY + 6, 8, s.y + T - capY - 6);
  ctx.fillStyle = '#c4407a'; ctx.beginPath(); ctx.ellipse(s.x + 16, capY + 6, 14 + sq * 2, 9 - sq * 2, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#ffd6e6'; ctx.fillRect(s.x + 8, capY + 1, 3, 3); ctx.fillRect(s.x + 19, capY - 1, 3, 3);
}
function drawCheck(c) {
  // Runenstein als Rücksetzpunkt
  const x = c.x, y = c.y + T;
  if (c.on) { ctx.fillStyle = 'rgba(111,227,200,.18)'; ctx.beginPath(); ctx.arc(x + 16, y - 16, 22, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#4a4262'; ctx.beginPath(); ctx.moveTo(x + 7, y); ctx.lineTo(x + 8, y - 24); ctx.quadraticCurveTo(x + 16, y - 36, x + 24, y - 24); ctx.lineTo(x + 25, y); ctx.fill();
  ctx.fillStyle = '#5b5278'; ctx.fillRect(x + 9, y - 24, 3, 22);
  ctx.strokeStyle = c.on ? '#7ff5d6' : '#2c2640'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(x + 16, y - 26); ctx.lineTo(x + 16, y - 6); ctx.moveTo(x + 12, y - 20); ctx.lineTo(x + 16, y - 16); ctx.lineTo(x + 20, y - 20);
  ctx.moveTo(x + 12, y - 11); ctx.lineTo(x + 20, y - 11); ctx.stroke();
}
function drawDoor(d) {
  const x = d.x, y = d.y - T;
  ctx.fillStyle = '#3d3358'; ctx.fillRect(x - 2, y - 4, T + 4, 2 * T + 4);
  ctx.fillStyle = '#0d2a14'; ctx.beginPath(); ctx.moveTo(x + 4, y + 2 * T); ctx.lineTo(x + 4, y + 12); ctx.arc(x + 16, y + 12, 12, Math.PI, 0); ctx.lineTo(x + 28, y + 2 * T); ctx.fill();
  ctx.fillStyle = `rgba(156,240,138,${0.5 + 0.3 * Math.sin(tick * 0.08)})`; ctx.fillRect(x + 8, y + 16, 16, 44);
  ctx.fillStyle = L.theme.top; ctx.fillRect(x - 2, y - 4, T + 4, 3);
}
function drawPlat(pl) {
  const th = L.theme;
  ctx.fillStyle = th.light; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
  ctx.fillStyle = th.topHi; ctx.fillRect(pl.x, pl.y, pl.w, 3);
  ctx.fillStyle = th.deep; ctx.fillRect(pl.x + 4, pl.y + pl.h - 3, pl.w - 8, 3);
  ctx.fillStyle = th.hang; ctx.fillRect(pl.x + 10, pl.y + pl.h, 2, 5); ctx.fillRect(pl.x + 44, pl.y + pl.h, 2, 3);
  ctx.fillStyle = th.speck; ctx.fillRect(pl.x + 20, pl.y + 5, 3, 3); ctx.fillRect(pl.x + 40, pl.y + 6, 4, 2);
}
function drawLantern(s, g = ctx, x = s.x, y = s.y, scale = 1) {
  // hängende Laterne als Sammelobjekt
  const sw = Math.sin(tick * 0.05 + (s ? s.ph : 0)) * 0.15, pulse = 0.5 + 0.5 * Math.sin(tick * 0.1 + (s ? s.ph : 0));
  g.save(); g.translate(x, y - 15 * scale); g.scale(scale, scale); g.rotate(sw);
  g.fillStyle = `rgba(255,190,90,${0.18 + 0.1 * pulse})`; g.beginPath(); g.arc(0, 15, 17, 0, 7); g.fill();
  g.strokeStyle = '#a89ac0'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, -4); g.lineTo(0, 5); g.stroke();
  g.beginPath(); g.arc(0, -5, 2.5, 0, 7); g.stroke();
  g.fillStyle = '#3b2f4a'; g.fillRect(-7, 5, 14, 4); g.fillRect(-5, 3, 10, 2);
  g.fillStyle = '#ffcf6b'; g.fillRect(-6, 9, 12, 13);
  g.fillStyle = '#fff2c0'; g.fillRect(-2.5, 11 + pulse, 5, 8 - pulse);
  g.fillStyle = '#3b2f4a'; g.fillRect(-7, 9, 2, 13); g.fillRect(5, 9, 2, 13); g.fillRect(-1, 9, 2, 13);
  g.fillRect(-7, 22, 14, 3); g.fillRect(-3, 25, 6, 2);
  g.restore();
}
function drawEnemy(e) {
  const leg = Math.sin(tick * 0.3 + e.sx) > 0 ? 1 : 0;
  ctx.fillStyle = '#2a2240';
  for (let i = 0; i < 3; i++) ctx.fillRect(e.x + 4 + i * 6 + (i % 2 ? leg : -leg), e.y + e.h - 3, 2, 3);
  ctx.fillStyle = '#6b5fa8'; ctx.beginPath(); ctx.ellipse(e.x + e.w/2, e.y + 9, 11, 9, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(e.x, e.y + 8, e.w, 5);
  ctx.fillStyle = '#9a8de0'; ctx.fillRect(e.x + 6, e.y + 3, 6, 2);
  ctx.fillStyle = '#4a4080'; ctx.fillRect(e.x + e.w/2 - 1, e.y + 1, 2, 11);
  const ex = e.dir > 0 ? e.x + e.w - 6 : e.x + 2;
  ctx.fillStyle = '#fff'; ctx.fillRect(ex, e.y + 7, 4, 4);
  ctx.fillStyle = '#120d1e'; ctx.fillRect(ex + (e.dir > 0 ? 2 : 0), e.y + 8, 2, 2);
}
function drawLumi(g, cx, by, o) {
  const sk = skin();
  g.save(); g.translate(cx, by); g.scale(o.sx, o.sy);
  const step = o.ground ? Math.sin(o.walk) * 3 : 0;
  g.fillStyle = sk.feet; g.fillRect(-7 + step, -4, 5, 4); g.fillRect(2 - step, -4, 5, 4);
  g.fillStyle = o.dim ? sk.dim : sk.c; g.beginPath(); g.ellipse(0, -13, 11, 11, 0, 0, 7); g.fill();
  g.fillStyle = sk.hi; g.beginPath(); g.ellipse(-4, -17, 3, 3, 0, 0, 7); g.fill();
  g.fillStyle = '#2a1a10'; const fx = o.face * 3;
  g.fillRect(fx - 4, -15, 3, 4); g.fillRect(fx + 2, -15, 3, 4);
  g.fillStyle = '#7fc46a'; g.fillRect(-1, -28, 2, 5); g.fillRect(o.face > 0 ? 1 : -5, -30, 4, 3);
  g.restore();
}

function hole(x, y, r) {
  if (r <= 0) return;
  const g = lx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.5, 'rgba(0,0,0,.7)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  lx.fillStyle = g; lx.beginPath(); lx.arc(x, y, r, 0, 7); lx.fill();
}
function drawLight() {
  lx.setTransform(S, 0, 0, S, 0, 0);
  lx.globalCompositeOperation = 'source-over'; lx.clearRect(0, 0, VW, VH);
  lx.fillStyle = 'rgba(5,3,12,0.66)'; lx.fillRect(0, 0, VW, VH);
  lx.globalCompositeOperation = 'destination-out';
  const ox = -cam.x, oy = -cam.y, flick = Math.sin(tick * 0.13) * 4;
  if (state !== 'dead') hole(P.x + P.w/2 + ox, P.y + 10 + oy, 165 + flick);
  for (const s of L.lanterns) if (!s.got && !lanternHidden(s) && Math.abs(s.x - cam.x - VW/2) < VW) hole(s.x + ox, s.y + oy, 52);
  for (const c of L.checks) hole(c.x + 16 + ox, c.y + 14 + oy, c.on ? 110 : 34);
  if (L.door) hole(L.door.x + 16 + ox, L.door.y + oy, 90);
  for (const q of parts) hole(q.x + ox, q.y + oy, 14);
  for (const t of trail) hole(t.x + ox, t.y + oy, 40 * t.life / t.max);
  ctx.drawImage(lc, 0, 0, VW, VH);
  if (state !== 'dead') {
    const [r, g, b] = skin().rgb;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const x = P.x + P.w/2 + ox, y = P.y + 10 + oy, gr = ctx.createRadialGradient(x, y, 0, x, y, 110);
    gr.addColorStop(0, `rgba(${r},${g},${b},.2)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = gr; ctx.fillRect(x - 110, y - 110, 220, 220); ctx.restore();
  }
}

function fmt(f) { const s = f / 60, m = Math.floor(s / 60); return `${m}:${(s % 60).toFixed(1).padStart(4, '0')}`; }
function text(str, x, y, size, col, align = 'center', weight = 700, fam = FONT) {
  ctx.font = `${weight} ${size}px ${fam}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillText(str, x + 1, y + 1.5);
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
const small = (str, x, y, size, col, align = 'center') => text(str, x, y, size, col, align, 500, BODY);
function drawHUD() {
  const g = ctx.createLinearGradient(0, 0, 0, 46); g.addColorStop(0, 'rgba(6,4,14,.85)'); g.addColorStop(1, 'rgba(6,4,14,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, 46);
  small(`Ebene ${li + 1} · ${L.def.name}`, 14, 18, 16, '#ffffff', 'left');
  drawLantern(null, ctx, VW - 262, 19, 0.6);
  small(`${lanternsNow()}/${L.lanterns.length}`, VW - 252, 18, 16, '#ffe2a3', 'left');
  small(`Stürze ${deaths}`, VW - 196, 18, 16, '#d6cbff', 'left');
  small(fmt(time), VW - 56, 18, 16, '#ffffff', 'right');
  if (muted) small('Ton aus', VW - 56, 38, 13, '#c9c0dc', 'right');
}
function panel(h) { ctx.fillStyle = 'rgba(8,5,16,.85)'; ctx.fillRect(0, VH/2 - h/2, VW, h); }

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = true;
  drawBG();
  ctx.save(); ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  drawTiles();
  drawFake(true);
  L.crumbles.forEach(drawCrumble);
  L.spikes.forEach(drawSpike); L.springs.forEach(drawSpring); L.checks.forEach(drawCheck);
  if (L.door) drawDoor(L.door);
  L.plats.forEach(drawPlat);
  for (const e of L.enemies) if (e.alive) drawEnemy(e);
  drawFake(false);
  for (const t of trail) {
    const k = t.life / t.max;
    ctx.fillStyle = `rgba(255,214,80,${0.15 * k})`; ctx.beginPath(); ctx.arc(t.x, t.y, 15 * k + 3, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(255,222,90,${0.75 * k})`; ctx.beginPath(); ctx.arc(t.x, t.y, 11 * k + 1, 0, 7); ctx.fill();
  }
  if (state !== 'dead') drawLumi(ctx, P.x + P.w/2, P.y + P.h, {sx: P.sx, sy: P.sy, face: P.face, walk: P.walk, ground: P.ground, dim: !(P.canDash || P.dashT > 0)});
  for (const q of parts) { ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.col; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawLight();
  // Laternen leuchten selbst und liegen deshalb über der Dunkelheit
  ctx.save(); ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  for (const s of L.lanterns) if (!s.got && !lanternHidden(s) && Math.abs(s.x - cam.x - VW/2) < VW) drawLantern(s);
  ctx.restore();
  if (state === 'idle') return;
  drawHUD();
  if (toastT > 0) {
    ctx.globalAlpha = Math.min(1, toastT / 30);
    ctx.fillStyle = 'rgba(8,5,16,.75)'; ctx.fillRect(VW/2 - 130, 56, 260, 34);
    small(toastMsg, VW/2, 73, 17, '#cdaeff');
    ctx.globalAlpha = 1;
  }
  if (state === 'pause') { panel(100); text('PAUSE', VW/2, VH/2 - 14, 36, '#ffffff'); small('Tippen zum Weiterspielen', VW/2, VH/2 + 24, 16, '#d6cbff'); }
  if (state === 'clear') {
    panel(126);
    text('EBENE GESCHAFFT!', VW/2, VH/2 - 26, 36, '#a8f597');
    small(`Laternen ${lanternsNow()}/${L.lanterns.length}   ·   Zeit ${fmt(time)}   ·   Stürze ${deaths}`, VW/2, VH/2 + 14, 17, '#ffe2a3');
    small(`Geheimgänge ${L.fgroups.filter(f => f.found).length}/${L.fgroups.length}   ·   ` +
      (li + 1 < LEVELS.length ? 'Die nächste Höhle ist jetzt offen.' : 'Alle Höhlen geschafft!'), VW/2, VH/2 + 40, 15, '#d6cbff');
  }
}

/* ---------- Menü ---------- */
const menu = $('menu'), LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const NODE_POS = [[9, 62], [25, 28], [41, 62], [57, 28], [73, 62], [90, 28]];
function setTab(t) {
  $('tabHome').setAttribute('aria-selected', t === 'home'); $('tabMap').setAttribute('aria-selected', t === 'map');
  $('viewHome').hidden = t !== 'home'; $('viewMap').hidden = t !== 'map';
  if (t === 'map') renderMap();
}
function openMenu(t) {
  menuOpen = true; menu.hidden = false; $('resume').hidden = !inLevel; $('restart').hidden = !inLevel;
  document.body.classList.add('menu-open'); if (typeof padReset === 'function') padReset();
  for (const id of ['tJump', 'tDash']) $(id).classList.remove('on');
  $('gear').setAttribute('aria-label', inLevel ? 'Menü schließen' : 'Menü');
  for (const k in key) key[k] = false;
  setTab(t);
}
function closeMenu() {
  if (!inLevel) return;
  menuOpen = false; menu.hidden = true; document.body.classList.remove('menu-open'); $('swatches').hidden = true; $('skinBtn').setAttribute('aria-expanded', 'false');
  $('gear').setAttribute('aria-label', 'Menü öffnen');
  if (state === 'pause') state = 'play';
  cv.focus({preventScroll: true});
}
function renderMap() {
  const map = $('map'); map.querySelectorAll('.node').forEach(n => n.remove());
  LEVELS.forEach((d, i) => {
    const open = i === 0 || save.done[i - 1], done = save.done[i], best = save.best[i];
    const b = document.createElement('button');
    b.className = 'node' + (done ? ' done' : '') + (open ? '' : ' locked');
    b.style.left = NODE_POS[i][0] + '%'; b.style.top = NODE_POS[i][1] + '%';
    const status = !open ? 'Gesperrt' : done && best ? `${best.lan}/${d.total} Laternen · ${fmt(best.time)}` : `${d.total} Laternen warten`;
    b.innerHTML = `<span class="dot">${open ? (done ? '✓' : i + 1) : LOCK}</span><span class="nm">${d.name}</span><span class="st">${status}</span>`;
    b.setAttribute('aria-label', `Ebene ${i + 1}, ${d.name}: ${status}`);
    if (open) b.addEventListener('click', () => { initAudio(); startLevel(i); });
    else b.setAttribute('aria-disabled', 'true');
    map.appendChild(b);
  });
  $('mapNote').textContent = save.done.every(Boolean) ? 'Alle sechs Höhlen geschafft!' : 'Schaffe eine Ebene, um die nächste freizuschalten.';
}
$('tabHome').addEventListener('click', () => setTab('home'));
$('tabMap').addEventListener('click', () => setTab('map'));
$('resume').addEventListener('click', closeMenu);
$('restart').addEventListener('click', () => { loadLevel(li); time = 0; deaths = 0; state = 'play'; closeMenu(); });
$('playBtn').addEventListener('click', () => { initAudio(); setTab('map'); });
$('gear').addEventListener('click', () => { initAudio(); if (menuOpen) closeMenu(); else openMenu('map'); });
const sw = $('swatches');
SKINS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'swatch'; b.style.background = s.c; b.title = s.name;
  b.setAttribute('aria-label', s.name); b.setAttribute('aria-pressed', i === save.skin);
  b.addEventListener('click', () => { save.skin = i; persist(); sw.querySelectorAll('.swatch').forEach((x, j) => x.setAttribute('aria-pressed', j === i)); });
  sw.appendChild(b);
});
$('skinBtn').addEventListener('click', () => { sw.hidden = !sw.hidden; $('skinBtn').setAttribute('aria-expanded', String(!sw.hidden)); });

const pv = $('lumiPrev'), pctx = pv.getContext('2d');
function drawPreview() {
  if ($('viewHome').hidden || menu.hidden) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1), size = pv.clientWidth || 124;
  if (pv.width !== Math.round(size * dpr)) { pv.width = pv.height = Math.round(size * dpr); }
  const k = pv.width / 124;
  pctx.setTransform(k, 0, 0, k, 0, 0); pctx.clearRect(0, 0, 124, 124);
  const [r, g, b] = skin().rgb, gr = pctx.createRadialGradient(62, 66, 0, 62, 66, 60);
  gr.addColorStop(0, `rgba(${r},${g},${b},.35)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  pctx.fillStyle = gr; pctx.fillRect(0, 0, 124, 124);
  pctx.fillStyle = 'rgba(0,0,0,.35)'; pctx.beginPath(); pctx.ellipse(62, 104, 26, 5, 0, 0, 7); pctx.fill();
  pctx.save(); pctx.translate(62, 104); pctx.scale(3, 3);
  const bob = Math.abs(Math.sin(tick * 0.06)) * 2;
  drawLumi(pctx, 0, -bob, {sx: 1, sy: 1 + bob * 0.02, face: 1, walk: 0, ground: true, dim: false});
  pctx.restore();
}

/* ---------- Schleife ---------- */
loadLevel(0); openMenu('home');
let acc = 0, last = performance.now();
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { if (!portrait() && (state !== 'pause' || menuOpen)) update(); acc -= 1000 / 60; }
  render(); drawPreview();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
